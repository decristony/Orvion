name: Optimize portfolio thumbnail images
on:
  push:
    branches: [main]
    paths:
      - "scripts/optimize_portfolio_thumbnails.py"
      - ".github/workflows/optimize-portfolio.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<12"
      - run: python scripts/optimize_portfolio_thumbnails.py
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portfolio/thumbs index.html pt/index.html en/index.html
          if ! git diff --cached --quiet; then
            git commit -m "perf: use lightweight portfolio thumbnails"
            git push
          fi
