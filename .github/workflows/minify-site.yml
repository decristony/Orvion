name: Build minified site assets
on:
  push:
    branches: [main]
    paths:
      - scripts/minify_site.py
      - .github/workflows/minify-site.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rcssmin rjsmin
      - run: python scripts/minify_site.py
      - name: Save built CSS and JS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.min.css js/main.min.js index.html pt/index.html en/index.html
          if ! git diff --cached --quiet; then
            git commit -m "perf: serve minified CSS and JS"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
